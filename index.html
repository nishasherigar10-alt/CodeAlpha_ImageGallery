<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>✨ My Image Gallery</h1>
        <p>Beautiful moments captured in pictures</p>
    </header>

    <main class="gallery">

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                 alt="Nature">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Beach">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                 alt="Mountain">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                 alt="Forest">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e"
                 alt="Plants">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b"
                 alt="Landscape">
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="Large image">

        <button class="next" id="next">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
